{% extends "base.html" %}

{% block title %}{{ get_text('login') }} - {{ get_text('app_name') }}{% endblock %}

{% block body %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>{{ get_text('login') }}</h1>
            <p>Welcome back to {{ get_text('app_name') }}</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">{{ get_text('email') }}</label>
                <input type="email" id="email" name="email" class="form-control" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">{{ get_text('password') }}</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                {{ get_text('login') }}
            </button>
        </form>

        <div class="auth-footer">
            {{ get_text('need_help') }} <a href="{{ url_for('signup') }}">{{ get_text('signup') }}</a>
        </div>
    </div>
</div>
{% endblock %}
